name: checkincheckout
description: CheckinCheckOut — AI Travel Agent
publish_to: none
version: 1.0.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # ─── State Management ─────────────────────────────────
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # ─── Navigation ───────────────────────────────────────
  go_router: ^14.6.1

  # ─── HTTP / API ───────────────────────────────────────
  dio: ^5.7.0
  retrofit: ^4.4.1

  # ─── Storage ──────────────────────────────────────────
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.3.3

  # ─── Auth / Biometrics ────────────────────────────────
  local_auth: ^2.3.0

  # ─── Voice (added in Milestone 5) ────────────────────
  web_socket_channel: ^3.0.1

  # ─── Push Notifications (added in Milestone 6) ───────

  # ─── UI ───────────────────────────────────────────────
  cached_network_image: ^3.4.1
  shimmer: ^3.0.0
  lottie: ^3.1.3
  intl: ^0.20.2

  # ─── Utils ────────────────────────────────────────────
  equatable: ^2.0.5
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0
  uuid: ^4.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.4.13
  freezed: ^2.5.7
  json_serializable: ^6.8.0
  riverpod_generator: ^2.6.1
  retrofit_generator: ^9.1.4

flutter:
  uses-material-design: true
  # assets and fonts added when files exist
